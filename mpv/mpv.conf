# RG DS Plus (libmali, no DRM render node): the Vulkan output cannot create a
# swapchain and hardware decode has no DRM device, so mpv showed no picture.
# Software decode into a Wayland shared-memory surface works without drops.
vo=wlshm
sws-fast=yes
sws-scaler=fast-bilinear

# Some fansub SRTs carry <font size=..> tags (converted from ASS) that blow
# the text up; render every subtitle in one plain style instead.
sub-ass-override=strip

# Resume an episode where it was left, and keep the chosen audio/subtitle track.
save-position-on-quit=yes
watch-later-dir=/storage/.config/mpv/watch_later
watch-later-options=start,sid,aid,sub-delay
