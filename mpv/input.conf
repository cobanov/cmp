# The pad is read by /storage/.config/mpv/media-hub.py; keep mpv's own SDL
# gamepad input quiet so buttons do not act twice.
GAMEPAD_LEFT_SHOULDER ignore
GAMEPAD_RIGHT_SHOULDER ignore

# Volume belongs to the system: ROCKNIX turns it up and down and shows its own
# notice. mpv's default bindings would also change mpv's own volume and show a
# second, different number, so leave the keys to the system.
VOLUME_UP ignore
VOLUME_DOWN ignore
MUTE ignore
