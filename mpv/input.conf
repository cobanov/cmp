# The pad is read by /storage/.config/mpv/media-hub.py; keep mpv's own SDL
# gamepad input quiet so buttons do not act twice.
GAMEPAD_LEFT_SHOULDER ignore
GAMEPAD_RIGHT_SHOULDER ignore

# Volume belongs to the system: ROCKNIX turns it up and down and shows its own
# notice. mpv's default bindings would also change mpv's own volume and show a
# second, different number, so leave the keys to the system.
VOLUME_UP ignore
VOLUME_DOWN ignore
MUTE ignore

# The main screen is not the touch screen: a touch on the second screen can
# reach this window as a click (while that output is off), and mpv's own
# bindings would then toggle fullscreen on a double tap. The touch remote
# binds the buttons itself and is not affected.
MBTN_LEFT ignore
MBTN_LEFT_DBL ignore
MBTN_RIGHT ignore
MBTN_MID ignore
WHEEL_UP ignore
WHEEL_DOWN ignore
